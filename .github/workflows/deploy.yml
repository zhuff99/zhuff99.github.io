name: Deploy to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # for the OIDC token exchanged with AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the AWS repo variables are set (see README)
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude "*" \
            --include "index.html" --include "styles.css" --include "main.js" \
            --include "projects.js" --include "img/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
